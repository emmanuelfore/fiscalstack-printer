name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  windows:
    name: Windows - full solution
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Path . -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) {
              $failures += "$($_.FullName): $($parseErrors[0].Message)"
            }
          }
          if ($failures.Count -gt 0) { throw "PowerShell parse errors:`n$($failures -join "`n")" }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore PrintInterceptor.sln

      - name: Build solution (Release)
        run: dotnet build PrintInterceptor.sln -c Release --no-restore

      - name: Test Core (Release)
        run: >-
          dotnet test tests/PrintInterceptor.Core.Tests/PrintInterceptor.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=core.trx"
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  windows-integration:
    name: Windows - service, installer and Ghostscript
    runs-on: windows-latest
    needs: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Windows build tools
        shell: pwsh
        run: |
          choco install innosetup ghostscript -y --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey tool installation failed ($LASTEXITCODE)." }

      - name: Build, sign, install and smoke-test on Windows
        shell: pwsh
        # The verifier trusts a temporary self-signed certificate; an RFC3161
        # timestamp would only add a network dependency to this smoke test.
        run: .\packaging\verify-windows-integration.ps1 -Version 1.0.0 -PurgeOnCleanup -TimestampUrl ''

  ubuntu-core:
    name: Ubuntu - Core library and tests only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Core and tests
        run: |
          dotnet restore src/PrintInterceptor.Core/PrintInterceptor.Core.csproj
          dotnet restore tests/PrintInterceptor.Core.Tests/PrintInterceptor.Core.Tests.csproj

      - name: Build Core (Release)
        run: dotnet build src/PrintInterceptor.Core/PrintInterceptor.Core.csproj -c Release --no-restore

      - name: Build Core tests (Release)
        run: dotnet build tests/PrintInterceptor.Core.Tests/PrintInterceptor.Core.Tests.csproj -c Release --no-restore

      - name: Test Core (Release)
        run: >-
          dotnet test tests/PrintInterceptor.Core.Tests/PrintInterceptor.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=core.trx"
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-core-test-results
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14
